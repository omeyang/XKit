name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.10'
  GOLANGCI_LINT_VERSION: 'v2.11.4'

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # 由 golangci-lint-action 管理缓存

      - name: Install librdkafka (for confluent-kafka-go)
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Check go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go mod tidy 检查失败，请运行 'go mod tidy' 并提交更改"
            exit 1
          fi

  # ==================== 单元测试 ====================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install librdkafka (for confluent-kafka-go)
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Clean build cache
        run: go clean -cache

      - name: Run tests with coverage
        run: go test -v -race -p 2 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          files: ./coverage.out
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==================== 构建验证 ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install librdkafka (for confluent-kafka-go)
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      # 跨平台编译验证：确保 !unix build tag 分支（如 xsys）持续可编译。
      # 仅编译验证，不运行测试（Windows 下无 librdkafka 等依赖）。
      - name: Cross-compile check (Windows)
        run: GOOS=windows GOARCH=amd64 go build ./pkg/util/xsys/...

      - name: Cross-compile check (Windows tests)
        run: GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./pkg/util/xsys/...

  # ==================== 安全扫描 ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install librdkafka (for confluent-kafka-go)
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ==================== 文档全文汇编（llms-full.txt 作为 CI 产物）====================
  # llms-full.txt 不入仓（见 .gitignore），CI 在 push/tag 时生成：
  #   - 作为工作流产物上传（Actions UI 下载，保留 90 天）
  #   - tag 触发时附加到对应 GitHub Release 的资产（要求 release 已存在）
  docs-llms:
    name: Build llms-full.txt
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release 资产上传
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate llms-full.txt
        run: bash scripts/gen-llms-full.sh

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llms-full
          path: llms-full.txt
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" llms-full.txt --clobber \
            || echo "::warning::release upload failed; ensure release ${GITHUB_REF_NAME} exists"

  # ==================== 工作流 Lint（可选，检查工作流配置）====================
  # 注意：集成测试已移至本地运行，使用 task kube-up && task kube-test && task kube-down
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install and run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint -color
